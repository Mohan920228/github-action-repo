name: cache node npm dependencies
description: This action allows to get npm cache

inputs:
  node-version:
    description: node version to use
    default: 20.x
    required: true
  working-directory:
    description: working directory of application
    required: false
    default: '.'


runs:
  using: composite
  steps:
    - name: setup node js version ${{inputs.node-version}}
      uses: actions/setup-node@v3
      with:
        node-version: ${{inputs.node-version}}
    - name: cache deps
      uses: actions/cache@v3
      id: cache
      with:
        path: ${{inputs.working-directory}}/node_modules
        key: npm-${{hashFiles(format('{0}/{1}',inputs.working-directory,'package-lock.json'))}}
    - name: Install dependencies
      if: steps.cache.inputs.cache-hit != 'true'
      run: npm ci
      shell: bash
      working-directory: ${{inputs.working-directory}}