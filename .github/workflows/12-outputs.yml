name: working with outputs
on:
  workflow_dispatch:
    inputs:
      build-choice:
        type: choice
        options:
          - success
          - failure
        default: success
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-status: ${{steps.build.outputs.status}}
      output2: ${{steps.build.outputs.output2}}
    steps:
      - name: Print github output
        run: echo $GITHUB_OUTPUT
      - name: Build
        id: build
        run: |
          echo "status=${{inputs.build-choice}}" >> $GITHUB_OUTPUT
          echo "output1=value1" >> $GITHUB_OUTPUT
          echo "output2=value2" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT
      - name: Print output1
        run: |
          echo "Printing output1: ${{steps.build.outputs.output1}}"
          echo "Printing json "
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{needs.build.outputs.build-status == 'success'}}
    steps:
      - name: Deploy
        run: echo "Deploying...!"
      - name: Printing output2
        run: |
          echo "Printing output2: ${{needs.build.outputs.output2}}"
