name: 13-working with caching
on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: whether to use cache
        type: boolean
        default: true
      node-version:
        description: Type of node version
        type: choice
        options:
          - 18.x
          - 20.x
          - 21.x
          - 22.x
          - 25.x
        default: 25.x
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caching/react-app
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{inputs.node-version}}
      - name: Download cache
        uses: actions/cache@v4
        if: ${{inputs.use-cache}}
        id: cache
        with:
          key: npm-${{hashFiles('caching/react-app/package-lock.json')}}
          path: caching/react-app/node_modules
      - name: Install dependendency
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm ci
      - name: Testing
        run: |
          npm run test
      - name: Building
        run: |
          npm run build
      - name: Deploying to non prod
        run: echo "Deploying to non prod"
