name: 13-working with caching
on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: whether to use cache
        type: boolean
        default: true
      node-version:
        description: Type of node version
        type: choice
        options:
          - 18.x
          - 20.x
          - 21.x
          - 22.x
          - 25.x
        default: 25.x
jobs:
  install-deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caching/react-app
    outputs:
      deps-cache-key: ${{steps.cache-key.outputs.CACHE_KEY}}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{inputs.node-version}}
      - name: calculate cache key
        id: cache-key
        run: |
          echo "CACHE_KEY= node-${{hashFiles('caching/react-app/package-lock.json')}}"
      - name: download package dependencies
        uses: actions/cache@v3
        if: ${{inputs.use-cache}}
        id: cache
        with:
          path: caching/react-app/node-modules
          key: ${{steps.cache-key.outputs.CACHE_KEY}}
      - name: install dependencies
        if: ${{steps.cache.outputs.cache-hit != 'true'}}
        run: |
          npm ci
  lint-test:
    runs-on: ubuntu-latest
    needs: install-deps
    defaults:
      run:
        working-directory: caching/react-app
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{inputs.node-version}}
      - name: Download cache
        uses: actions/cache@v3
        id: cache
        if: ${{inputs.use-cache}}
        with:
          path: caching/react-app/node-modules
          key: ${{needs.install-deps.outputs.deps-cache-key}}
      - name: Testing
        run: |
          npm run test
      - name: Linting
        run: |
          echo "Linting..."
  build:
    runs-on: ubuntu-latest
    needs: install-deps
    defaults:
      run:
        working-directory: caching/react-app
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{inputs.node-version}}
      - name: Download cache
        uses: actions/cache@v4
        if: ${{inputs.use-cache}}
        id: cache
        with:
          key: npm-${{hashFiles('caching/react-app/package-lock.json')}}
          path: caching/react-app/node_modules
      - name: Install dependendency
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm ci
      - name: Testing
        run: |
          npm run test
      - name: Building
        run: |
          npm run build
      - name: Deploying to non prod
        run: echo "Deploying to non prod"
