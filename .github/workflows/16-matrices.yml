name: 16-Matrices
on: workflow_dispatch
jobs:
  backwards-compatibility:
    name: ${{matrix.os-version}}-${{matrix.node-version}}
    runs-on: ${{matrix.os-version}}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 21.x, 22.x]
        os-version:
          - ubuntu-latest
          - windows-latest
        include:
          - node-version: 23.x
            os-version: ubuntu-latest
          - node-version: 25.x
            os-version: ubuntu-latest
            tags: experimental
    steps:
      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Fail if experiment
        if: matrix.tags == 'experimental'
        run: exit 1
      - name: Perform some task
        run: |
          echo "Running test on os ${{matrix.os-version}} on node ${{matrix.node-version}}"
          sleep 10
      - name: Upload test results
        run: |
          echo "Uploading test results"
  dummy-job:
    name: ${{matrix.color}}-${{matrix.shape}}-${{matrix.size}}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        color: [red, green]
        shape: [circle, square]
        size: [small, large]
        include:
          - color: yellow
            shape: triangle
    steps:
      - name: Dummy step
        run: echo "${{matrix.color}}-${{matrix.shape}}-${{matrix.size}}"
