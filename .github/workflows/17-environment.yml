name: working with environment
run-name: Execution on ${{inputs.target-env}}
on:
  workflow_dispatch:
    inputs:
      target-env:
        type: environment
        default: staging
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: echo vars
        run: |
          echo "Env Varuialbe : ${{vars.MY_VAR || 'Default value'}}"
  E2E_testing:
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: E2E testing
        run: |
          echo "Running E2E testing"
  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    needs: [deploy-staging, E2E_testing]
    steps:
      - name: deploy production
        run: echo "Deploying prod"
