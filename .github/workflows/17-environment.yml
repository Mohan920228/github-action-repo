name: working with environment
run-name: Execution on ${{inputs.target-env}}
on:
  workflow_dispatch:
    inputs:
      target-env:
        type: environment
        default: staging
jobs:
  echo:
    runs-on: ubuntu-latest
    environment: ${{inputs.target-env}}
    env:
      my-env-value: ${{vars.MY_ENV_VALUE || 'default value'}}
    steps:
      - name: echo vars
        run: |
          echo "Env Varuialbe : ${{env.my-env-value}}"
