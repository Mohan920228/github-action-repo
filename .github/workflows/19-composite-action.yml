name: 19-custom-action-composit
run-name: target env- ${{inputs.target-env}}
on:
  workflow_dispatch:
    inputs:
      target-env:
        description: which env to targert
        type: choice
        options:
          - dev
          - prod
env:
  working-directory: 4-caching-action/react-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup node and dependencies
        uses: ./.github/actions/composit-cache-deps
        with:
          node-version: 20.x
          working-directory: ${{env.working-directory}}
          target-env: ${{inputs.target-env}}
      - name: Test
        run: npm run test
        working-directory: ${{env.working-directory}}
      - name: build
        run: npm run build
        working-directory: ${{env.working-directory}}
