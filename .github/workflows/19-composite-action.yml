name: 19-custom-action-composit

on:
  workflow_dispatch:

env:
  working-directory: 4-caching-action/react-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup node and dependencies
        uses: ./.github/actions/composit-cache-deps
        with:
          node-version: 20.x
          working-directory: ${{env.working-directory}}
      - name: Test
        run: npm run test
        working-directory: ${{env.working-directory}}
      - name: build
        run: npm run build
        working-directory: ${{env.working-directory}}
