name: 20-1-reusable workflow
on:
  workflow_call:
    inputs:
      target-directory:
        type: string
        required: true
    outputs:
      build-status:
        description: status of build process
        value: ${{jobs.deploy.outputs.build-status}}
      url:
        description: output of url
        value: ${{jobs.deploy.outputs.url}}
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      build-status: ${{ steps.build.outputs.build-status}}
      url: ${{steps.deploy.outputs.url}}
    steps:
      - name: checkout repo
        uses: actions/checkout@v5

      - name: Build
        id: build
        run: |
          echo "Building using directory..."
          echo "build-status=success" >> "$GITHUB_OUTPUT"
      - name: Deploy
        id: deploy
        run: |
          echo "Deploy the artifacts"
          echo "url=https://www.google.com"
