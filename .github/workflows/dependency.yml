name: 10-controlling the execution flow
on:
  workflow_dispatch:
    inputs:
      pass-unit-test:
        type: boolean
        description: Whether unit test will pass or not
        default: true
jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Lint and build
        run: |
          echo "Linting and building project"
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Testing
        run: |
          echo "Running test...!
      - name: Failing test
        if: ${{ inputs.pass-unit-test }}
        run: |
         exit 1
  deploy-non-prod:
    runs-on: ubuntu-latest
    needs: 
      - lint-build
      - unit-test
    steps:
      - name: deploying to non-prod
        run: echo "Deploying to non-prod..!"
  e2e-tests:
    runs-on: ubuntu-latest
    needs: 
      - deploy-non-prod
    steps:
      - name: Running e2e test
        run: echo "Running e2e test"
  load-test:
    runs-on: ubuntu-latest
    needs: deploy-non-prod
    steps:
      - name: running load test
        run: echo "Running load test...!"
  deploy-prod:
    runs-on: ubuntu-latest
    needs: 
      - e2e-tests
      - load-test
    steps:
      - name: deploy-prod
        run: echo "deploying to prod...!"
       